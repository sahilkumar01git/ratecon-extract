[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ratecon-extract"
version = "0.3.0"
description = "LLM extraction pipeline that turns unstructured freight rate confirmations into validated, schema-checked JSON with cost-aware confidence scoring."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openai>=1.35",
    "pydantic>=2.8",
    "python-dateutil>=2.9",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
ratecon-extract = "ratecon_extract.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
